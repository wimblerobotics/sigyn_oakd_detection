# ── flake8 ─────────────────────────────────────────────────────────────────
[flake8]
max-line-length = 100
# Google Python style uses double quotes; override ament_flake8 default.
inline-quotes = double
# Ignore:
#   W503 – line break before binary operator (conflicts with W504, Black-style)
extend-ignore = W503

# ── pep257 / pydocstyle ────────────────────────────────────────────────────
[pydocstyle]
# ament_pep257 defaults to NumPy/Epytext conventions; override for Google style.
# Ignored codes:
#   D107 – Missing docstring in __init__ (Google style puts it on the class)
#   D203 – 1 blank line before docstring (conflicts with D211 which we want)
#   D213 – Multi-line summary on second line (conflicts with D212, Google style)
#   D301 – Use r""" for backslash escapes (too strict for path examples)
#   D406 – Section name should end with newline (NumPy style only)
#   D407 – Missing dashed underline after section (NumPy style only)
#   D408 – Section underline should be in the line after the section name (NumPy)
#   D409 – Section underline should match the length of its name (NumPy)
#   D413 – Missing blank line after last section (NumPy style only)
add-ignore = D107,D203,D213,D301,D406,D407,D408,D409,D413

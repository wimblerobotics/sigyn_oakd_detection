#
# Custom flake8 configuration for sigyn_oakd_detection.
# Extends the ament_flake8 defaults and overrides the quote style to use
# double quotes, which is consistent with Google Python Style.

[flake8]
# ── Inherited from ament_flake8 defaults ────────────────────────────────────
extend-ignore = B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I202
import-order-style = google
max-line-length = 100
show-source = true
statistics = true

# ── Project overrides ────────────────────────────────────────────────────────
# Google Python Style uses double quotes.
inline-quotes = double
